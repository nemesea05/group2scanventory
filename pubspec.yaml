name: group2scanventory
description: "A new Flutter project for inventory management."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Barcode Scanning via Camera 
  mobile_scanner: ^5.2.1

  # Picking images
  image_picker: ^1.1.2

  # Local data storage
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Optional Cloud Backup 
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/scaventory-logo.png